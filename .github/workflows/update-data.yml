name: Update data

# Keeps https://donchakt.github.io/ufc-stats/ current without anyone touching it.
#   full = UFCStats fight data + UFC.com events/results/rankings/athletes + news + odds -> rebuild -> publish
#   odds = BestFightOdds lines only (rebuild + publish only when a line moved)
# Every run also runs a health check and keeps one GitHub issue (label: data-health) listing anything that needs a fix.
# Cron times are UTC (Saskatoon = UTC-6). GitHub may start scheduled runs late (often 5-30 min) at busy times.
on:
  schedule:
    - cron: "37 11 * * *"      # full rebuild daily, ~5:37 AM CST
    - cron: "37 23 * * 6"      # full: Saturday ~5:37 PM CST (fight-day card changes)
    - cron: "37 6 * * 0"       # full: Sunday ~12:37 AM CST (results as soon as the card ends)
    - cron: "17 */3 * * *"     # odds every 3 hours
    - cron: "47 * * * 5,6"     # odds hourly on Fridays and Saturdays (UTC) = fight-week crunch
  workflow_dispatch:
    inputs:
      mode:
        description: "full (everything) or odds (odds only)"
        type: choice
        options: [full, odds]
        default: full

permissions:
  contents: write   # commit the refreshed index.html / data.json
  issues: write     # open / update / close the data-health issue
  pages: write      # ask GitHub Pages to rebuild after a bot commit

concurrency:
  group: update-data
  cancel-in-progress: false

env:
  TZ: America/Regina
  PYTHONUNBUFFERED: "1"

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pick mode
        id: mode
        run: |
          m="${{ github.event.inputs.mode }}"
          if [ -z "$m" ]; then
            case "${{ github.event.schedule }}" in
              "17 */3 * * *"|"47 * * * 5,6") m=odds ;;
              *) m=full ;;
            esac
          fi
          echo "mode=$m" >> "$GITHUB_OUTPUT"; echo "Mode: $m"

      - name: Restore page cache
        uses: actions/cache/restore@v4
        with:
          path: pipeline/app/cache
          key: ufc-cache-${{ github.run_id }}
          restore-keys: ufc-cache-

      - name: Keep committed odds state
        run: git checkout -- pipeline/app/cache/odds.json pipeline/app/cache/bfo/open.json

      - name: Run pipeline
        id: run
        run: python3 pipeline/run.py "${{ steps.mode.outputs.mode }}"

      - name: Commit and push if changed
        id: push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A index.html data.json manifest.webmanifest icon-192.png icon-512.png apple-touch-icon.png pipeline
          if git diff --cached --quiet; then echo "No changes to publish"; echo "pushed=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          git commit -m "Data update ($(date '+%b %-d, %Y %-I:%M %p') CST, ${{ steps.mode.outputs.mode }})"
          for i in 1 2 3; do git pull --rebase --quiet && git push && break; sleep 5; done
          echo "pushed=1" >> "$GITHUB_OUTPUT"

      - name: Rebuild GitHub Pages
        if: steps.push.outputs.pushed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "::warning::Could not request a Pages build (it usually starts on its own after the push)"

      - name: Health check
        if: always()
        run: python3 pipeline/health_check.py

      - name: Update data-health issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          f=pipeline/app/cache/health.json; [ -f "$f" ] || exit 0
          count=$(jq .count "$f")
          num=$(gh issue list --label data-health --state open --json number --jq '.[0].number // empty' 2>/dev/null || true)
          if [ "$count" -gt 0 ]; then
            title="Data health check: $count item(s) need attention"
            if [ -n "$num" ]; then
              gh issue edit "$num" --title "$title" --body-file pipeline/app/cache/health.md
            else
              gh label create data-health --color D93F0B --description "Automated data health check" 2>/dev/null || true
              gh issue create --title "$title" --body-file pipeline/app/cache/health.md --label data-health
            fi
          elif [ -n "$num" ]; then
            gh issue comment "$num" --body "All clear as of $(date '+%b %-d, %Y %-I:%M %p') CST - closing. A new issue will open if anything breaks again."
            gh issue close "$num"
          fi

      - name: Save page cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: pipeline/app/cache
          key: ufc-cache-${{ github.run_id }}
