<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07070a"><meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Fight Stats">
<meta name="description" content="Unofficial fan-made MMA stats app: upcoming cards, matchups, rankings, fighter profiles and ratings.">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://www.ufc.com">
<title>Fight Stats · unofficial fan stats</title>
<style>
:root{--bg:#07070a;--bg2:#0d0d12;--p1:#131319;--p2:#1a1a22;--p3:#24242e;--ln:#ffffff14;--ln2:#ffffff22;--tx:#f5f5f7;--mu:#a7a7b4;--mu2:#7a7a88;
--red:#e21d2b;--red2:#ff4d58;--blue:#2f7bff;--blue2:#6aa2ff;--gold:#f2b23a;--gold2:#ffd27a;--win:#2fd27f;--loss:#ff5a62;
--disp:"Oswald","Bebas Neue","Arial Narrow","Roboto Condensed",Impact,sans-serif;--body:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 var(--body);-webkit-font-smoothing:antialiased}
body{background:radial-gradient(1200px 600px at 50% -200px,#3a0a10 0,transparent 60%),var(--bg);min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:var(--blue2)}
.disp{font-family:var(--disp);text-transform:uppercase;letter-spacing:.02em}
/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:linear-gradient(180deg,#07070af5,#07070ad0);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--ln)}
.back{width:36px;height:36px;border-radius:12px;background:var(--p2);display:grid;place-items:center;border:1px solid var(--ln)}
.brand{flex:1;min-width:0;font-family:var(--disp);font-weight:700;font-size:21px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand b{color:var(--red2)}.brand .mk{display:inline-block;width:22px;height:22px;vertical-align:-4px;margin-right:6px}
.asof{font-size:10.5px;color:var(--mu2);text-align:right;line-height:1.25}
main{max-width:920px;margin:0 auto;padding:14px 14px calc(110px + env(safe-area-inset-bottom))}
.view{animation:vin .35s ease both}@keyframes vin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
/* nav */
.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;width:min(560px,calc(100% - 20px));display:flex;background:#16161ccc;backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%);border:1px solid var(--ln2);border-radius:22px;padding:6px;box-shadow:0 10px 40px #000a}
.tabs button{flex:1;position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0 6px;border-radius:16px;color:var(--mu2);font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;transition:color .2s}
.tabs svg{width:23px;height:23px;transition:transform .25s}
.tabs button.on{color:#fff;background:linear-gradient(180deg,#e21d2b33,#e21d2b14)}.tabs button.on svg{transform:translateY(-1px) scale(1.06);color:var(--red2)}
.tabs button.on::after{content:"";position:absolute;top:2px;width:22px;height:3px;border-radius:3px;background:var(--red2);box-shadow:0 0 12px var(--red2)}
/* common */
.card{background:linear-gradient(180deg,var(--p1),#101015);border:1px solid var(--ln);border-radius:22px;overflow:hidden;margin-bottom:14px}
.h2{font-family:var(--disp);font-size:15px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mu);margin:22px 4px 10px;display:flex;align-items:center;gap:8px}
.h2::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--red)}
.sub{color:var(--mu);font-size:12.5px}.mu2{color:var(--mu2)}
.foot{color:var(--mu2);font-size:11.5px;line-height:1.55;padding:6px 6px 12px}
.chip{display:inline-flex;align-items:center;gap:3px;border-radius:9px;padding:2px 8px;font-weight:800;font-size:12.5px;background:#ffffff10;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip small{font-weight:600;font-size:10px;opacity:.7}
.t5{color:#ffd27a;background:#f2b23a26;box-shadow:inset 0 0 0 1px #f2b23a55}.t4{color:#5fe3a1;background:#2fd27f1f}.t3{color:#b6e36b;background:#a8d65a1c}.t2{color:#f5c35b;background:#f2b23a17}.t1{color:#ff8a6a;background:#ff5a4a1a}.t0{color:var(--mu2)}
.badge{display:inline-flex;align-items:center;gap:5px;border-radius:8px;padding:3px 9px;font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
.b-belt{color:#1a1204;background:linear-gradient(135deg,#ffe08a,#f2b23a 45%,#b07a12);box-shadow:0 0 18px #f2b23a55}
.b-rank{color:var(--gold2);background:#f2b23a1f;border:1px solid #f2b23a55}
.b-pro{color:#8fe8ff;background:#22c5ff1c;border:1px solid #22c5ff55}.b-small{color:var(--mu);background:#ffffff0d;border:1px solid var(--ln2)}
/* photos */
.ph{position:relative;overflow:hidden;display:grid;place-items:center;background:radial-gradient(circle at 50% 35%,#ffffff18,#ffffff05 70%);flex:none}
.ph .ini{font-family:var(--disp);font-weight:700;color:#ffffffcc;letter-spacing:.03em}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 0;opacity:0;transition:opacity .4s}
.ph.ok img{opacity:1}.ph.ok .ini{opacity:0}
.av{width:42px;height:42px;border-radius:50%;border:2px solid var(--ln2)}.av .ini{font-size:15px}
.av img{transform:scale(2.1);transform-origin:50% 8%}.av.fl img{transform:scale(2.1) scaleX(-1)}
.av.red{border-color:#e21d2b99}.av.blue{border-color:#2f7bff99}
.cut{background:none}.cut img{object-fit:contain;object-position:50% 100%}.cut.fl img{transform:scaleX(-1)}
.cut .ini{width:64%;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:34px;background:#ffffff12;border:2px solid var(--ln2)}
/* rings */
.ring{position:relative;display:inline-grid;place-items:center;flex:none}
.ring svg{transform:rotate(-90deg);display:block}.ring .bgc{stroke:#ffffff14}
.ring .fg{stroke-linecap:round;animation:rg 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes rg{from{stroke-dashoffset:var(--c)}}
.ring .v{position:absolute;text-align:center;line-height:1}.ring .v b{font-family:var(--disp);font-weight:700;display:block}.ring .v small{font-size:9px;color:var(--mu);font-weight:700;letter-spacing:.06em}
/* bars */
.bar{height:8px;border-radius:8px;background:#ffffff10;position:relative;overflow:visible}
.bar>i{position:absolute;left:0;top:0;bottom:0;border-radius:8px;width:var(--w);background:linear-gradient(90deg,#b3121d,var(--red2));animation:gw 1s cubic-bezier(.2,.8,.2,1) both}
@keyframes gw{from{width:0}}
.mk2{position:absolute;top:-4px;bottom:-4px;width:2px;background:#fff;border-radius:2px;opacity:.85;box-shadow:0 0 0 2px #07070a}
/* events */
.hero{position:relative;border-radius:26px;overflow:hidden;margin-bottom:16px;border:1px solid var(--ln2);background:linear-gradient(105deg,#5a0b12 0,#1a0709 42%,#07101f 58%,#0b2a5c 100%);cursor:pointer;box-shadow:0 20px 60px #0008}
.hero::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,#ffffff05 0 2px,transparent 2px 14px);pointer-events:none}
.hero .hd{position:relative;padding:16px 18px 0;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.kick{font-size:11px;font-weight:800;letter-spacing:.18em;color:var(--gold2);text-transform:uppercase}
.hero .tt{font-family:var(--disp);font-size:30px;font-weight:700;line-height:1.02;text-transform:uppercase;margin-top:4px}
.hero .vn{color:#ffffffb3;font-size:12.5px;margin-top:4px}
.cd{display:flex;gap:6px;position:relative;padding:12px 18px 0}
.cd div{flex:1;background:#00000055;border:1px solid var(--ln2);border-radius:14px;padding:8px 0 6px;text-align:center;backdrop-filter:blur(6px)}
.cd b{font-family:var(--disp);font-size:26px;font-weight:700;display:block;line-height:1;font-variant-numeric:tabular-nums}.cd span{font-size:9.5px;color:var(--mu);font-weight:700;letter-spacing:.14em}
.fo{position:relative;display:grid;grid-template-columns:1fr auto 1fr;align-items:end;height:250px;margin-top:6px}
.fo .side{position:relative;height:100%;display:flex;flex-direction:column;justify-content:flex-end;cursor:pointer}
.fo .side .cut{position:absolute;inset:0 0 54px 0}
.fo .side.l .cut{-webkit-mask-image:linear-gradient(90deg,#000 70%,transparent);mask-image:linear-gradient(90deg,#000 70%,transparent)}
.fo .side.r .cut{-webkit-mask-image:linear-gradient(270deg,#000 70%,transparent);mask-image:linear-gradient(270deg,#000 70%,transparent)}
.fo .nmb{position:relative;padding:8px 12px}
.back[hidden]{display:none!important}
.fo .side.r .nmb{text-align:right}
.fo .nm{font-family:var(--disp);font-weight:700;font-size:20px;line-height:1;text-transform:uppercase;text-shadow:0 2px 10px #000}
.fo .side.l .nm{border-left:4px solid var(--red);padding-left:8px}.fo .side.r .nm{border-right:4px solid var(--blue);padding-right:8px}
.vsb{align-self:center;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-family:var(--disp);font-weight:700;font-size:21px;background:radial-gradient(circle,#fff 0,#ddd 60%,#999);color:#111;box-shadow:0 0 0 4px #00000066,0 0 30px #ffffff55;z-index:2;margin-bottom:70px;animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px #00000066,0 0 44px #ffffff88}}
.split{position:relative;margin:0 18px 16px;display:flex;align-items:center;gap:8px;font-family:var(--disp);font-weight:700;font-size:18px}
.split .sb{flex:1;height:12px;border-radius:12px;overflow:hidden;display:flex;background:#ffffff14}
.split .sb i{display:block;height:100%;animation:gw 1.2s cubic-bezier(.2,.8,.2,1) both}
.sbr{background:linear-gradient(90deg,#8d0d15,var(--red2));width:var(--w)}.sbb{background:linear-gradient(90deg,var(--blue2),#174bb0);flex:1}
.lbl{display:flex;justify-content:space-between;margin:0 18px 4px;font-size:10.5px;color:var(--mu);font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.evc{display:flex;gap:0;margin-bottom:12px;border-radius:20px;overflow:hidden;border:1px solid var(--ln);background:linear-gradient(110deg,var(--g1,#2a0a0e),#121218 55%);cursor:pointer;transition:transform .15s}
.evc:active{transform:scale(.985)}
.dt{width:78px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,var(--red),#8b0e17);padding:12px 0}
.dt .m{font-size:11px;font-weight:800;letter-spacing:.16em}.dt .d{font-family:var(--disp);font-weight:700;font-size:36px;line-height:1}.dt .w{font-size:10px;font-weight:700;opacity:.8;letter-spacing:.12em}
.evc .bd{flex:1;min-width:0;padding:12px 14px}
.evc .tt{font-family:var(--disp);font-weight:700;font-size:19px;line-height:1.05;text-transform:uppercase}
.evc .me{display:flex;align-items:center;gap:6px;margin-top:9px}.evc .me .avs{display:flex}.evc .me .avs .av{width:30px;height:30px;margin-right:-8px}
.pill{display:inline-block;background:#ffffff0f;border:1px solid var(--ln);border-radius:999px;padding:2px 9px;font-size:11px;color:var(--mu);margin:7px 5px 0 0}
/* event view */
.evh{border-radius:24px;padding:18px;margin-bottom:12px;background:linear-gradient(115deg,#5a0b12,#14080a 55%,#0b2a5c);border:1px solid var(--ln2)}
.evh .tt{font-family:var(--disp);font-weight:700;font-size:28px;line-height:1.02;text-transform:uppercase}
.sec{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--red2);background:#ffffff08;border-top:1px solid var(--ln)}
.sec:first-child{border-top:0}
.bout{display:block;width:100%;text-align:left;padding:12px 14px;border-top:1px solid var(--ln);transition:background .15s}.bout:hover{background:#ffffff06}
.bout .wc{text-align:center;font-size:10px;letter-spacing:.14em;color:var(--mu2);text-transform:uppercase;font-weight:700;margin-bottom:8px}
.bout.main .wc{color:var(--gold2)}
.brow{display:grid;grid-template-columns:1fr 26px 1fr;gap:8px;align-items:center}
.fc{display:flex;align-items:center;gap:9px;min-width:0}.fc.r{flex-direction:row-reverse;text-align:right}
.fc .n{font-weight:800;font-size:14px;line-height:1.15;overflow:hidden;text-overflow:ellipsis}.fc .s{font-size:11.5px;color:var(--mu);margin-top:2px}
.rk{color:var(--gold2);font-weight:800;font-size:11px}
.vsm{font-family:var(--disp);font-weight:700;color:var(--mu2);font-size:14px;text-align:center}
.mini{display:flex;align-items:center;gap:8px;margin-top:9px;font-size:11.5px;color:var(--mu);font-weight:700;font-variant-numeric:tabular-nums}
.mini .sb{flex:1;height:6px;border-radius:6px;overflow:hidden;display:flex;background:#ffffff14}.mini .sb i{display:block;height:100%}
/* tale of the tape */
.tot{position:relative;overflow:hidden;border-radius:26px;border:1px solid var(--ln2);background:linear-gradient(100deg,#4a0910,#130709 45%,#071022 55%,#0b2a5c);margin-bottom:14px}
.tot .fo{height:290px}
.tot .wc{position:relative;text-align:center;font-size:11px;letter-spacing:.2em;font-weight:800;color:var(--gold2);text-transform:uppercase;padding-top:14px}
.rings{display:flex;justify-content:space-between;padding:0 16px 14px;position:relative}
.rings .meta{font-size:12px;color:#ffffffc0}
.probc{padding:14px 16px 6px}
.pr{margin-bottom:12px}.pr .lb{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--mu);margin-bottom:6px}
.src{font-size:10px;font-weight:800;letter-spacing:.08em;border-radius:6px;padding:2px 7px;text-transform:uppercase}
.s1{background:#e21d2b2e;color:var(--red2)}.s2{background:#2f7bff2e;color:var(--blue2)}.s3{background:#f2b23a2e;color:var(--gold2)}
.pr .row{display:flex;align-items:center;gap:10px;font-family:var(--disp);font-weight:700;font-size:22px}
.pr .row .sb{flex:1;height:16px;border-radius:16px;overflow:hidden;display:flex;background:#ffffff14;box-shadow:inset 0 0 0 1px #ffffff10}
.pr .row .sb i{display:block;height:100%;animation:gw 1.2s cubic-bezier(.2,.8,.2,1) both}
.pr .row span{width:52px}.pr .row span:last-child{text-align:right}
.cw{color:var(--red2)}.cb{color:var(--blue2)}
/* mirrored rows */
.mrow{padding:9px 16px;border-top:1px solid var(--ln)}
.mrow .lb{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;font-weight:800;font-variant-numeric:tabular-nums}
.mrow .lb em{font-style:normal;font-size:10.5px;font-weight:700;letter-spacing:.12em;color:var(--mu);text-transform:uppercase}
.mrow .lb .adv{color:#fff;text-shadow:0 0 12px currentColor}
.mb2{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-top:6px}
.mb2 .h{height:8px;background:#ffffff0d;position:relative;overflow:visible}
.mb2 .h.l{border-radius:8px 2px 2px 8px}.mb2 .h.r{border-radius:2px 8px 8px 2px}
.mb2 .h i{position:absolute;top:0;bottom:0;width:var(--w);animation:gw 1s cubic-bezier(.2,.8,.2,1) both}
.mb2 .h.l i{right:0;background:linear-gradient(270deg,#e21d2b,#7a0b12);border-radius:8px 2px 2px 8px}
.mb2 .h.r i{left:0;background:linear-gradient(90deg,#2f7bff,#123d8f);border-radius:2px 8px 8px 2px}
.mb2 .h i.g{box-shadow:0 0 14px var(--gl);filter:brightness(1.25)}
.mb2 .h.l i.g{--gl:#ff3341}.mb2 .h.r i.g{--gl:#3f8cff}
.mb2 .h .mk2{top:-3px;bottom:-3px}
/* category cards */
details.cat{border-top:1px solid var(--ln)}details.cat:first-of-type{border-top:0}
details.cat>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer}
details.cat>summary::-webkit-details-marker{display:none}
details.cat>summary .tx{flex:1;min-width:0}
details.cat>summary .ct{font-family:var(--disp);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase}
details.cat>summary .ln{font-size:12.5px;color:#ffffffc8;margin-top:1px}
details.cat>summary .chev{color:var(--mu2);transition:transform .25s}details.cat[open]>summary .chev{transform:rotate(180deg)}
details.cat .body{padding:0 0 8px;animation:vin .3s ease both}
.srow{padding:8px 16px}
.srow .lb{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;margin-bottom:6px}
.srow .lb b{font-size:15px;font-variant-numeric:tabular-nums}.srow .lb .pc{font-size:10.5px;color:var(--mu);font-weight:700}
.srow .ds{font-size:10.5px;color:var(--mu2);margin-top:5px}
.pair{display:flex;gap:4px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:6px 16px 12px}
.kpi{background:#ffffff08;border:1px solid var(--ln);border-radius:14px;padding:9px 6px;text-align:center}
.kpi b{display:block;font-family:var(--disp);font-size:22px;font-weight:700;line-height:1.1}.kpi span{font-size:10px;color:var(--mu);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
/* profile */
.ph-hero{position:relative;border-radius:26px;overflow:hidden;border:1px solid var(--ln2);margin-bottom:14px;min-height:340px;background:linear-gradient(150deg,hsl(var(--hue) 70% 22%),#0c0c12 70%)}
.ph-hero::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#07070af0 0,#07070a00 55%);pointer-events:none}
.ph-hero .cut{position:absolute;right:-6%;top:6px;bottom:0;width:62%}
.ph-hero .cut .ini{font-size:56px}
.ph-hero .inf{position:relative;z-index:2;padding:18px 18px 16px;display:flex;flex-direction:column;min-height:340px}
.ph-hero .nick{color:var(--gold2);font-weight:800;font-size:12px;letter-spacing:.16em;text-transform:uppercase}
.ph-hero .big{font-family:var(--disp);font-size:42px;font-weight:700;line-height:.95;text-transform:uppercase;margin:6px 0 10px;max-width:70%;text-shadow:0 4px 20px #000}
.ph-hero .bg{display:flex;flex-wrap:wrap;gap:6px;max-width:72%}
.wld{display:flex;gap:16px;margin-top:auto;align-items:flex-end}
.wld div{text-align:center}.wld b{font-family:var(--disp);font-size:40px;font-weight:700;line-height:1;display:block}.wld span{font-size:10px;font-weight:800;letter-spacing:.16em;color:var(--mu)}
.wld .w b{color:var(--win)}.wld .l b{color:var(--loss)}.wld .d b{color:var(--mu)}
.rt-blk{display:flex;align-items:center;gap:16px;padding:16px}
.parts3{display:flex;gap:10px;flex:1;justify-content:space-around}
.parts3>div{text-align:center;font-size:10.5px;color:var(--mu);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.form6{display:flex;gap:6px;padding:4px 16px 14px}
.form6 i{flex:1;font-style:normal;text-align:center;border-radius:10px;padding:7px 0;font-family:var(--disp);font-weight:700;font-size:15px;animation:vin .4s ease both}
.W{background:#2fd27f22;color:var(--win);box-shadow:inset 0 0 0 1px #2fd27f55}.L{background:#ff5a6222;color:var(--loss);box-shadow:inset 0 0 0 1px #ff5a6255}.D,.NC{background:#ffffff10;color:var(--mu)}
.fight{display:grid;grid-template-columns:38px 1fr auto;gap:10px;align-items:center;padding:10px 16px;border-top:1px solid var(--ln)}
.fight .res{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-family:var(--disp);font-weight:700}
.fight .o{font-weight:800}.fight .m{text-align:right;font-size:12.5px;font-weight:700}.fight .m span{display:block;color:var(--mu);font-weight:500;font-size:11.5px}
.note{color:var(--mu2);font-size:11.5px;padding:6px 16px 12px;line-height:1.5}
/* rankings */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:700px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{position:relative;height:150px;border-radius:20px;overflow:hidden;border:1px solid var(--ln2);text-align:left;background:linear-gradient(160deg,hsl(var(--hue) 65% 24%),#0d0d13 75%);transition:transform .15s}
.tile:active{transform:scale(.97)}.tile.on{box-shadow:0 0 0 2px var(--red2)}
.tile .cut{position:absolute;right:-14px;top:8px;bottom:0;width:62%}.tile .cut .ini{font-size:22px;width:56px}
.tile::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#07070ae0 0,#07070a40 60%,transparent)}
.tile .tx{position:absolute;z-index:2;left:12px;right:12px;bottom:10px}
.tile .dn{font-family:var(--disp);font-weight:700;font-size:17px;line-height:1.02;text-transform:uppercase}
.tile .cn{font-size:11.5px;color:#ffffffcc;margin-top:4px}
.tile .tg{position:absolute;z-index:2;left:12px;top:10px;font-size:9.5px;font-weight:800;letter-spacing:.14em;color:var(--gold2)}
.rlist{grid-column:1/-1;border-radius:20px;overflow:hidden;border:1px solid var(--ln);background:var(--p1);animation:vin .3s ease both}
.rrow{display:grid;grid-template-columns:40px 42px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;padding:8px 14px;border-top:1px solid var(--ln)}
.rrow:first-child{border-top:0}.rrow:hover{background:#ffffff06}
.rrow .num{font-family:var(--disp);font-weight:700;font-size:24px;color:var(--mu);text-align:center}.rrow .num.c{color:var(--gold)}
.rrow .n{font-weight:800}.rrow.ch{background:linear-gradient(90deg,#f2b23a1a,transparent)}
/* news */
.nw{background:linear-gradient(180deg,var(--p1),#101015);border:1px solid var(--ln);border-radius:20px;padding:14px 16px;margin-bottom:10px;border-left:4px solid var(--cc,#555);animation:vin .35s ease both}
.nw .mt{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:11.5px;color:var(--mu)}
.nw .h{font-weight:700;font-size:15px;margin:8px 0 10px;line-height:1.35}
.nw .fl{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cat2{border-radius:7px;padding:2px 8px;font-weight:800;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--cc);background:color-mix(in srgb,var(--cc) 18%,transparent)}
.fchip{display:inline-flex;align-items:center;gap:6px;background:#ffffff0a;border:1px solid var(--ln2);border-radius:999px;padding:2px 9px 2px 2px;font-size:12.5px;font-weight:700}
.fchip .av{width:26px;height:26px;border-width:1px}.fchip.x{padding:3px 10px;color:var(--mu)}
.nw a{font-size:12px;font-weight:700;text-decoration:none;margin-left:auto}
/* search & compare */
.sbox{position:relative}.sbox svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:19px;height:19px;color:var(--mu2)}
.search{width:100%;padding:14px 14px 14px 42px;border-radius:16px;border:1px solid var(--ln2);background:var(--p2);color:var(--tx);font:16px var(--body);outline:none}
.search:focus{border-color:var(--red);box-shadow:0 0 0 3px #e21d2b33}
.li{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:9px 14px;border-top:1px solid var(--ln)}.li:first-child{border-top:0}.li:hover{background:#ffffff06}
.li .tx{flex:1;min-width:0}.li .n{font-weight:800}
.empty{padding:34px;text-align:center;color:var(--mu)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.pick{position:relative}.pick .search{padding-left:14px}.pick.a .search{border-color:#e21d2b77}.pick.b .search{border-color:#2f7bff77}
.dd{position:absolute;left:0;right:0;top:100%;z-index:10;margin-top:4px;background:var(--p2);border:1px solid var(--ln2);border-radius:14px;max-height:300px;overflow:auto;box-shadow:0 12px 30px #000a}
.disc{margin-top:18px;padding:14px;border-radius:16px;background:#ffffff06;border:1px solid var(--ln);color:var(--mu2);font-size:11.5px;line-height:1.55}

/* profile */
function profile(i){const f=F[i];const rec=(f.rec||'').split('-');const r=f.rt;
 let h=`<div class="view"><div class="ph-hero" style="--hue:${hueOf(f.div)}">${photo(f,'cut','r')}<div class="inf">${f.nick?`<div class="nick">"${esc(f.nick)}"</div>`:''}<div class="big">${esc(f.name)}</div><div class="bg">${badges(f)}<span class="badge b-small">${esc(f.div||'')}</span></div>
 <div class="wld">${rec.length>=2?`<div class="w"><b>${esc(rec[0])}</b><span>WINS</span></div><div class="l"><b>${esc(rec[1])}</b><span>LOSSES</span></div><div class="d"><b>${esc(rec[2]||0)}</b><span>DRAWS</span></div>`:''}</div></div></div>`;
 h+=`<div class="card"><div class="rt-blk">${RR(f,104,'OVERALL')}<div class="parts3">${r?[['Results',r[10],'#ff4d58',r[9]?'Elo '+r[9]:''],['Skill',r[11],'#6aa2ff','opp.-adjusted'],['Ranking',r[12],'#f2b23a',f.rank?'':'from results']].map(([l,v,c,s])=>`<div>${ring(v,58,c)}<div style="margin-top:5px">${l}</div><div style="font-weight:500;letter-spacing:0;text-transform:none;color:var(--mu2)">${s}</div></div>`).join(''):'<div class="sub">Not rated yet: no UFC fight data (debut).</div>'}</div></div>`;
 if(r)h+=`<div style="padding:0 16px 14px">${[['Striking',1],['Wrestling',2],['Grappling',3],['Defence',4],['Cardio / durability',5]].map(([l,k])=>`<div class="srow" style="padding:5px 0"><div class="lb"><span>${l}</span><b style="color:${rcol(r[k])}">${r[k].toFixed(1)}</b></div><div class="bar"><i style="--w:${r[k]*10}%"></i></div></div>`).join('')}</div><div class="note">Overall = 50% results vs. quality of opposition + 20% skill (stats adjusted for opponent strength) + 30% UFC ranking (unranked: implied from results), plus a résumé bonus for wins over top-level opponents.${r[15]==1?' Prospect: few UFC fights, so the pro record is used as a light prior.':''}</div>`;
 h+='</div>';
 if(f.fights.length)h+=`<div class="h2">Form · last ${f.fights.length}</div><div class="card"><div class="form6" style="padding-top:14px">${f.fights.map((x,j)=>`<i class="${x.r}" style="animation-delay:${j*60}ms">${x.r}</i>`).join('')}</div>${f.fights.map(x=>`<div class="fight"><div class="res ${x.r}">${x.r}</div><div style="min-width:0"><div class="o">vs ${esc(x.o)}</div><div class="sub">${esc(x.e)} · ${x.d}</div></div><div class="m">${esc(x.m)}<span>${x.rd?'R'+x.rd+' · '+x.t:''}</span></div></div>`).join('')}</div>`;
 else h+='<div class="card"><div class="note" style="padding:16px">No UFC fights on record yet (UFC debut).</div></div>';
 h+=`<div class="h2">Stats</div>${catCards(f)}<div class="foot">${f.st?`Averages from ${f.ufc} UFC fight${f.ufc==1?'':'s'}${f.ufc<3?' (small sample)':''}. `:''}White tick = ${esc(f.div||'division')} average; percentile vs. fighters in this division in the app.</div>`;
 return h+'</div>'}
/* rankings */
let openDiv=-1;
function rankings(){let h='<div class="view"><div class="tiles">';const tile=(r,i)=>{const cf=r[1]>=0?F[r[1]]:F[r[2][0]];return `<button type="button" class="tile${openDiv==i?' on':''}" data-d="${i}" style="--hue:${hueOf(r[0].replace("Women's ","W "))}">${cf?photo(cf,'cut','r'):''}<span class="tg">${r[1]>=0?'&#9733; CHAMPION':'#1'}</span><div class="tx"><div class="dn">${esc(r[0].replace('Pound-for-Pound','P4P'))}</div><div class="cn">${cf?esc(cf.name)+' '+CH(cf):''}</div></div></button>`};
 const list=r=>{const rows=[];if(r[1]>=0)rows.push(['C',r[1]]);r[2].forEach((x,j)=>rows.push([j+1,x]));return `<div class="rlist">${rows.map(([n,x])=>`<button type="button" class="rrow${n=='C'?' ch':''}" data-f="${x}"><span class="num ${n=='C'?'c':''}">${n}</span>${photo(F[x],'av')}<span style="min-width:0"><div class="n">${esc(F[x].name)}</div><div class="sub">${esc(F[x].rec||'')}${F[x].rt&&F[x].rt[15]==1?' · <span style="color:#8fe8ff">Prospect</span>':''}</div></span>${CH(F[x])}</button>`).join('')}</div>`};
 const cols=matchMedia('(min-width:700px)').matches?3:2;
 D.rk.forEach((r,i)=>{h+=tile(r,i);const endRow=(i%cols==cols-1)||i==D.rk.length-1;if(openDiv>=0&&endRow&&Math.floor(openDiv/cols)==Math.floor(i/cols))h+=list(D.rk[openDiv])});
 return h+'</div><div class="foot" style="margin-top:12px">Official UFC.com rankings. Chips = our overall rating out of 10 (gold 8.5+, green 7.5+).</div>'+footNote()+'</div>'}
/* news */
const catc=c=>/injur|withdraw/i.test(c)?'#ff5a62':/booked|schedule/i.test(c)?'#2fd27f':/title/i.test(c)?'#f2a03a':/callout|target/i.test(c)?'#b98cff':/roster|weigh/i.test(c)?'#6aa2ff':'#a7a7b4';
function news(){return '<div class="view">'+D.news.map((n,j)=>`<div class="nw" style="--cc:${catc(n[2])};animation-delay:${Math.min(j,8)*40}ms"><div class="mt"><span class="cat2">${esc(n[2])}</span><span>${esc(n[0])}</span><span>· ${esc(n[3])}</span></div><div class="h">${esc(n[1])}</div><div class="fl">${n[4].map(x=>typeof x=='number'?`<button type="button" class="fchip" data-f="${x}">${photo(F[x],'av')}${esc(F[x].name)} ${CH(F[x])}</button>`:`<span class="fchip x">${esc(x)}</span>`).join('')}<a href="${n[5]}" target="_blank" rel="noopener">${esc(n[6])} ↗</a></div></div>`).join('')+'<div class="foot">Recent items from UFC.com, ESPN, MMA Fighting, Sherdog and Bloody Elbow. "Reported" and "Rumoured" items are not official.</div>'+footNote()+'</div>'}
/* search & compare */
let q='',ca=null,cb=null,qa='',qb='';
const li=(i,attr)=>`<button type="button" class="li" ${attr}="${i}">${photo(F[i],'av')}<div class="tx"><div class="n">${esc(F[i].name)}</div><div class="sub">${esc([F[i].div,F[i].rec,F[i].rank].filter(Boolean).join(' · '))}</div></div>${CH(F[i])}</button>`;
const SVGS='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>';
function matchList(s){const qq=fold(s.trim());let a=F.map((f,i)=>i);if(qq)a=a.filter(i=>fold(F[i].name+' '+(F[i].nick||'')).includes(qq));return a.sort((x,y)=>F[x].name.localeCompare(F[y].name))}
function search(){const a=matchList(q);return `<div class="view"><div class="sbox">${SVGS}<input class="search" id="q" placeholder="Search ${F.length} fighters" value="${esc(q)}" autocomplete="off" aria-label="Search fighters"></div><div class="card" style="margin-top:12px" id="sl">${a.map(i=>li(i,'data-f')).join('')||'<div class="empty">No fighters match</div>'}</div></div>`}
function compare(){const pick=(s,qv,sel)=>`<div class="pick ${s}"><input class="search" data-side="${s}" placeholder="${s=='a'?'Red corner':'Blue corner'}" value="${esc(sel!=null?F[sel].name:qv)}" autocomplete="off" aria-label="Fighter ${s.toUpperCase()}"><div class="dd" id="dd${s}" hidden></div></div>`;
 let h=`<div class="view"><div class="two">${pick('a',qa,ca)}${pick('b',qb,cb)}</div>`;
 if(ca!=null&&cb!=null){const A=F[ca],B=F[cb];h+=`<div class="tot"><div class="wc">Compare · if they fought</div>${faceoff(ca,cb,A.rank&&A.rank.split(' · ')[0],B.rank&&B.rank.split(' · ')[0])}${ringsRow(A,B)}</div>`;
  h+=A.rt&&B.rt?`<div class="card"><div class="probc">${probRow('Stats estimate','s2',prob(A.rt[8],B.rt[8]),'if they fought')}</div></div>`:'<div class="card"><div class="note" style="padding:14px">No stats estimate: a fighter is unrated (no UFC data).</div></div>';
  h+=`<div class="h2">Tale of the tape</div>${tape(A,B)}<div class="foot">The stats estimate accounts for opponent quality (Elo) but ignores weight class and ranking.</div>`}
 else h+=`<div class="tot" style="padding:40px 20px;text-align:center"><div class="vsb" style="margin:0 auto 14px;animation:none">VS</div><div class="disp" style="font-size:22px;font-weight:700">Build your own matchup</div><div class="sub" style="margin-top:6px">Pick a red corner and a blue corner above.</div></div>`;return h+'</div>'}
function footNote(){return `<div class="disc"><b style="color:var(--mu)">Unofficial fan stats app.</b> Not affiliated with, endorsed by or connected to the UFC. Fighter photos load from public UFC.com athlete pages and belong to their owners. Data as of ${esc(D.asof)}. Sources: UFC.com (events, rankings, athlete pages), UFCStats.com fight data, BestFightOdds (market odds), ESPN, MMA Fighting, Sherdog, Bloody Elbow (news).</div>`}
/* shell */
const ICON={events:'<rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M8 3v4M16 3v4M3.5 10h17"/><path d="m10 14 1.5 1.5L14.5 13" stroke-width="2"/>',rankings:'<path d="M7 4h10v4a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 4M17 6h3a3 3 0 0 1-3 4M12 13v4M8 21h8M9 17h6"/>',news:'<path d="M5 4h11v16H6a2 2 0 0 1-2-2V5a1 1 0 0 1 1-1z"/><path d="M16 8h3a1 1 0 0 1 1 1v9a2 2 0 0 1-4 0M8 8h5M8 12h5M8 16h3"/>',search:'<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/>',compare:'<circle cx="7" cy="8" r="3"/><circle cx="17" cy="8" r="3"/><path d="M2.5 20a4.5 4.5 0 0 1 9 0M12.5 20a4.5 4.5 0 0 1 9 0"/>'};
const TABS=[['events','Events'],['rankings','Rankings'],['news','News'],['search','Search'],['compare','Compare']];
let tab='events',stack=[];
const MARK='<svg class="mk" viewBox="0 0 64 64"><defs><linearGradient id="mg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff4d58"/><stop offset="1" stop-color="#9b0d16"/></linearGradient></defs><path d="M22 4h20l18 18v20L42 60H22L4 42V22z" fill="url(#mg)"/><path d="M24 12h16l12 12v16L40 52H24L12 40V24z" fill="none" stroke="#f2b23a" stroke-width="3"/></svg>';
$('#asof').innerHTML='Data as of<br>'+esc(D.asof);
function tabs(){$('#tabs').innerHTML=TABS.map(([k,l])=>`<button type="button" data-t="${k}" class="${tab==k&&!stack.length?'on':tab==k?'on':''}" aria-label="${l}"${tab==k?' aria-current="page"':''}><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICON[k]}</svg>${l}</button>`).join('');
 $$('#tabs button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;stack=[];render();scrollTo({top:0})})}
function push(v){stack.push(v);render();scrollTo({top:0})}
$('#back').onclick=()=>{stack.pop();render()};
function render(){tabs();const top=stack[stack.length-1];$('#back').hidden=!stack.length;let h,t=MARK+'FIGHT<b>STATS</b>';
 if(top&&top[0]=='f'){h=profile(top[1]);t=esc(F[top[1]].name)}else if(top&&top[0]=='e'){h=event(top[1]);t=esc(D.cards[top[1]][0])}else if(top&&top[0]=='m'){h=matchup(top[1],top[2]);t='Tale of the tape'}
 else h={events,rankings,news,search,compare}[tab]();$('#ttl').innerHTML=t;$('#main').innerHTML=h;wire();tick()}
function wire(){$$('[data-f]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();push(['f',+e.dataset.f])});
 $$('[data-c]').forEach(e=>e.onclick=()=>push(['e',+e.dataset.c]));
 const top=stack[stack.length-1];$$('[data-b]').forEach(e=>e.onclick=()=>push(['m',top[1],+e.dataset.b]));
 $$('[data-d]').forEach(e=>e.onclick=()=>{const i=+e.dataset.d;openDiv=openDiv==i?-1:i;render();const el=document.querySelector('.rlist');if(el)el.scrollIntoView({behavior:'smooth',block:'nearest'})});
 const qi=$('#q');if(qi){qi.oninput=()=>{q=qi.value;$('#sl').innerHTML=matchList(q).map(i=>li(i,'data-f')).join('')||'<div class="empty">No fighters match</div>';$$('#sl [data-f]').forEach(e=>e.onclick=()=>push(['f',+e.dataset.f]))}}
 $$('input[data-side]').forEach(inp=>{const s=inp.dataset.side,dd=$('#dd'+s);inp.onfocus=()=>inp.select();inp.oninput=()=>{if(s=='a'){qa=inp.value;ca=null}else{qb=inp.value;cb=null}
  dd.innerHTML=inp.value.trim()?matchList(inp.value).slice(0,30).map(i=>li(i,'data-p'+s)).join('')||'<div class="empty">No fighters match</div>':'';dd.hidden=!inp.value.trim();
  dd.querySelectorAll('[data-p'+s+']').forEach(e=>e.onclick=()=>{if(s=='a')ca=+e.getAttribute('data-pa');else cb=+e.getAttribute('data-pb');render()})}})}
(()=>{const h=new URLSearchParams(location.hash.slice(1));if(h.get('tab'))tab=h.get('tab');if(h.get('div'))openDiv=+h.get('div');if(h.get('q'))q=h.get('q');if(h.get('ca'))ca=+h.get('ca');if(h.get('cb'))cb=+h.get('cb');if(h.get('v'))stack=[h.get('v').split(',').map((x,i)=>i?+x:x)]})();
render();
</script></body></html>
