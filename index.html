.tabs button svg{width:24px;height:24px}.tabs button.on{color:var(--red2)}
.card{background:var(--p1);border:1px solid var(--ln);border-radius:18px;overflow:hidden;margin-bottom:14px}

 const fl=f.fights.length?f.fights.map(x=>`<div class="fight"><div class="res ${x.r}">${x.r}</div><div><div class="nm">vs ${esc(x.o)}</div><div class="sub">${esc(x.e)} · ${x.d}</div></div><div class="m">${esc(x.m)}<span>${x.rd?'R'+x.rd+' · '+x.t:''}</span></div></div>`).join(''):'<div class="note">No UFC fights on record yet (UFC debut).</div>';
 return `<div class="card"><div class="hero">${f.nick?`<div class="nick">"${esc(f.nick)}"</div>`:''}<div class="big">${esc(f.name)}</div><div class="tags">${tags.join('')}</div></div>${ovBlock(f)}${st}${wi.length?'<div class="wins">'+wi.map(x=>`<div class="win"><div class="v">${x[1]}</div><div class="l">${x[0]}</div></div>`).join('')+'</div>':''}<h3>Last ${f.fights.length||''} UFC fights</h3>${fl}${f.st?`<div class="note">Averages from ${f.ufc} UFC fight${f.ufc==1?'':'s'}${f.ufc<3?' (small sample)':''}.</div>`:''}</div>`}
function fbtn(x,right,rk){if(typeof x!='number')return `<div class="${right?'r':''}"><div class="nm">${esc(x)}</div></div>`;const f=F[x];
 return `<div class="${right?'r':''}"><div class="nm">${right&&rk?`<span class="rk">${esc(rk)}</span>`:''}${esc(f.name)}${!right&&rk?`<span class="rk">${esc(rk)}</span>`:''}</div><div class="sub">${f.rec?esc(f.rec)+' · ':''}${RT(f)}</div></div>`}
function probLine(lab,cls,pa,pb,extra){return `<div class="prow"><div class="lab"><span><span class="src ${cls}">${lab}</span></span><span>${extra||''}</span></div><b>${pa}%</b><div class="pbar" style="margin:0"><i style="width:${pa}%;background:var(--red)"></i><i style="width:${pb}%;background:var(--blu)"></i></div><b class="r">${pb}%</b></div>`}
function probs(b){let h='';if(b[8]!=null)h+=probLine('Our model','s1',b[8],100-b[8],'v0.4.4 pick');
 if(b[6]!=null)h+=probLine('Stats estimate','s2',b[6],100-b[6],'from results + skill ratings');if(b[7]!=null)h+=probLine('Market','s3',b[7],100-b[7],`${b[9]} books · <a href="${b[10]}" target="_blank" rel="noopener" style="color:#8db4ff">BestFightOdds</a>`);
 return h?`<div class="prob">${h}</div>`:'<div class="note">No probability: at least one fighter has no UFC data, and no odds are posted yet.</div>'}
function event(ci){const c=D.cards[ci];const t={'Main card':c[3],'Prelims':c[4],'Early prelims':c[5]};let last='__',h='';
 c[6].forEach((b,i)=>{const s=b[0]||'Announced bouts (order not final)';if(s!=last){h+=`<div class="sec">${s}${t[s]?' · '+t[s]+' CST':''}</div>`;last=s}
  const p=b[8]!=null?b[8]:b[6]!=null?b[6]:b[7];
  h+=`<div class="bout" data-b="${i}"><div class="wc">${i==0?'Main event · ':''}${esc(b[1])}</div><div class="brow">${fbtn(b[2],1,b[4])}<div class="vs">VS</div>${fbtn(b[3],0,b[5])}</div>${p!=null?`<div style="display:flex;align-items:center;gap:8px;margin-top:8px" class="sub"><span style="width:30px">${p}%</span><div class="pbar" style="flex:1;margin:0"><i style="width:${p}%;background:var(--red)"></i><i style="width:${100-p}%;background:var(--blu)"></i></div><span style="width:30px;text-align:right">${100-p}%</span></div>`:''}</div>`});
 if(!c[6].length)h='<div class="empty">Bouts not announced yet.</div>';
 return `<div class="card"><div class="evc" style="cursor:default"><div class="t">${esc(c[0])}</div><div class="d">${esc(c[1])} · ${esc(c[2])}</div></div>${h}</div><div class="foot">Tap a fight for the matchup. Bar = win chance (our model if drafted, else stats estimate, else market).</div>`}
function cmpRows(A,B){const r=[];const row=(l,va,vb,better,fa,fb)=>{let ca='',cb='';if(better&&va!=null&&vb!=null&&va!==vb){const aw=better>0?va>vb:va<vb;ca=aw?'better':'';cb=aw?'':'better'}
  r.push(`<div class="cmp"><div class="a ${ca}">${fa!=null?fa:(va==null?'–':esc(va))}</div><div class="l">${l}</div><div class="b ${cb}">${fb!=null?fb:(vb==null?'–':esc(vb))}</div></div>`)};
 row('Overall',A.rt&&A.rt[0],B.rt&&B.rt[0],1,A.rt?A.rt[0].toFixed(1):null,B.rt?B.rt[0].toFixed(1):null);
 ['Striking','Wrestling','Grappling','Defence','Cardio/Dur.'].forEach((l,i)=>row(l,A.rt&&A.rt[i+1],B.rt&&B.rt[i+1],1));
 row('Record',A.rec,B.rec,0);row('Age',A.age,B.age,0);row('Height',A.ht,B.ht,1,ft(A.ht),ft(B.ht));row('Reach',A.reach,B.reach,1,A.reach?A.reach+'"':null,B.reach?B.reach+'"':null);row('Stance',A.stance,B.stance,0);row('UFC fights',A.ufc,B.ufc,0);
 S.forEach(s=>row(s[0],A.st&&A.st[s[2]],B.st&&B.st[s[2]],s[5],A.st&&A.st[s[2]]!=null?A.st[s[2]]+s[4]:null,B.st&&B.st[s[2]]!=null?B.st[s[2]]+s[4]:null));
 const wf=f=>f.w&&f.w[0]!=null?f.w[0]+f.w[1]:null;row('Finish wins',wf(A),wf(B),1);row('Last 5',null,null,0,A.fights.length?form(A):'–',B.fights.length?form(B):'–');return r.join('')}
function matchup(ci,bi){const b=D.cards[ci][6][bi];const A=typeof b[2]=='number'?F[b[2]]:null,B=typeof b[3]=='number'?F[b[3]]:null;
 const side=(f,x,rk,r)=>`<div class="side ${r?'r':''}" ${f?`data-f="${BY[f.slug]}"`:''}><div class="nm">${esc(f?f.name:x)}</div><div class="sub">${rk?`<span class="rk" style="margin:0">${esc(rk)}</span> `:''}${f&&f.rec?esc(f.rec):''}</div><div style="margin-top:6px">${f?RT(f):''}</div></div>`;
 let h=`<div class="card"><div class="mhead">${side(A,b[2],b[4],0)}<div class="vs" style="padding-top:4px">VS</div>${side(B,b[3],b[5],1)}</div><div class="sec" style="text-align:center">${esc(b[1])}</div>${probs(b)}`;
 if(A&&B){h+=cmpRows(A,B);h+=`<div class="note">Green = better on paper (lower is better for SApM). Tap a name for the full profile. * small-sample rating.</div>`}
 return h+'</div>'+`<div class="foot">Stats estimate = logistic on the gap in results + skill rating (ranking left out), fit on ${D.fit.n} UFC fights since 2018 using ratings from before each fight; it called ${Math.round(D.fit.accuracy*100)}% of winners (the betting favourite wins about 72%), so treat it as rough. Market = median no-vig line across books on BestFightOdds, as of ${D.asof}.</div>`}
function events(){return D.cards.map((c,i)=>{const n=c[6].length;const p=(c[3]?c[3]+' CST main card':'')||'';return `<div class="card evc" data-c="${i}"><div class="go">›</div><div class="t">${esc(c[0])}</div><div class="d">${esc(c[1])} · ${esc(c[2])}</div><div class="m"><span class="pill">${n?n+' fights':'Bouts TBA'}</span>${p?`<span class="pill">${p}</span>`:''}${n?`<span class="pill">${esc(nameOf(c[6][0][2]))} vs ${esc(nameOf(c[6][0][3]))}</span>`:''}</div></div>`}).join('')}
function rankings(){return '<div class="card">'+D.rk.map((r,i)=>{const open=openDiv==i;let h=`<div class="div" data-d="${i}"><span>${esc(r[0])}</span><span class="c">${r[1]>=0?'C: '+esc(F[r[1]].name)+' · ':''}${open?'▲':'▼'}</span></div>`;
 if(open){const rows=[];if(r[1]>=0)rows.push(['C',r[1]]);r[2].forEach((x,j)=>rows.push([j+1,x]));h+=rows.map(([n,x])=>`<div class="rrow" data-f="${x}"><span class="n">${n}</span><span><span class="nm">${esc(F[x].name)}</span> <span class="sub">${esc(F[x].rec||'')}</span></span>${RT(F[x])}</div>`).join('')}
 return h}).join('')+'</div><div class="foot">UFC.com official rankings. Rating = our overall out of 10.</div>'}
function news(){const cc=c=>/injur|withdraw/i.test(c)?'inj':/booked/i.test(c)?'bk':/title/i.test(c)?'tt':'';
 return '<div class="card">'+D.news.map(n=>`<div class="news"><div class="meta"><span>${n[0]}</span><span class="cat ${cc(n[2])}">${esc(n[2])}</span><span>${esc(n[3])}</span></div><div class="h">${esc(n[1])}</div><div class="meta">${n[4].map(x=>typeof x=='number'?`<span class="chip" data-f="${x}">${esc(F[x].name)} ${RT(F[x])}</span>`:`<span class="chip x">${esc(x)}</span>`).join('')}<a href="${n[5]}" target="_blank" rel="noopener">${esc(n[6])} ↗</a></div></div>`).join('')+'</div><div class="foot">Recent items from UFC.com, ESPN, MMA Fighting, Sherdog and Bloody Elbow. "Reported"/"Rumoured" items are not official.</div>'}
function flist(qs,attr){const qq=fold(qs.trim());let a=F.map((f,i)=>i);if(qq)a=a.filter(i=>fold(F[i].name+' '+(F[i].nick||'')).includes(qq));else return '';
 return a.slice(0,40).map(i=>`<div class="li" ${attr}="${i}"><div><div class="nm">${esc(F[i].name)}</div><div class="sub">${esc([F[i].div,F[i].rec,F[i].rank].filter(Boolean).join(' · '))}</div></div>${RT(F[i])}</div>`).join('')||'<div class="empty">No fighters match</div>'}
function search(){const qq=fold(q.trim());let a=F.map((f,i)=>i);if(qq)a=a.filter(i=>fold(F[i].name+' '+(F[i].nick||'')).includes(qq));a.sort((x,y)=>F[x].name.localeCompare(F[y].name));
 return `<input class="search" id="q" placeholder="Search ${F.length} fighters..." value="${esc(q)}" autocomplete="off"><div class="card" style="margin-top:12px" id="sl">${a.map(i=>`<div class="li" data-f="${i}"><div><div class="nm">${esc(F[i].name)}</div><div class="sub">${esc([F[i].div,F[i].rec,F[i].rank].filter(Boolean).join(' · '))}</div></div>${RT(F[i])}</div>`).join('')||'<div class="empty">No fighters match</div>'}</div>`}
function compare(){const pick=(side,qv,sel)=>`<div class="pick"><input class="search" data-side="${side}" placeholder="Fighter ${side.toUpperCase()}" value="${esc(sel!=null?F[sel].name:qv)}" autocomplete="off"><div class="dd" id="dd${side}" hidden></div></div>`;
 let h=`<div class="two">${pick('a',qa,ca)}${pick('b',qb,cb)}</div>`;
 if(ca!=null&&cb!=null){const A=F[ca],B=F[cb];h+=`<div class="card"><div class="mhead"><div class="side" data-f="${ca}"><div class="nm">${esc(A.name)}</div><div style="margin-top:6px">${RT(A)}</div></div><div class="vs">VS</div><div class="side r" data-f="${cb}"><div class="nm">${esc(B.name)}</div><div style="margin-top:6px">${RT(B)}</div></div></div>`;
  h+=A.rt&&B.rt?`<div class="prob">${probLine('Stats estimate','s2',prob(A.rt[8],B.rt[8]),100-prob(A.rt[8],B.rt[8]),'if they fought')}</div>`:'<div class="note">No stats estimate: a fighter is unrated (no UFC data).</div>';
  h+=cmpRows(A,B)+'</div><div class="foot">Green = better value. The stats estimate accounts for opponent quality (Elo) but ignores weight class and ranking.</div>'}else h+='<div class="empty">Pick two fighters to compare.</div>';return h}
function render(){tabs();const top=stack[stack.length-1];$('#back').hidden=!stack.length;let h,t='UFC <b>STATS</b>';
 if(top&&top[0]=='f'){h=profile(top[1]);t=esc(F[top[1]].name)}else if(top&&top[0]=='e'){h=event(top[1]);t=esc(D.cards[top[1]][0])}else if(top&&top[0]=='m'){h=matchup(top[1],top[2]);t='Matchup'}
 else h={events,rankings,news,search,compare}[tab]();$('#ttl').innerHTML=t;$('#main').innerHTML=h;wire()}
function wire(){document.querySelectorAll('[data-f]').forEach(e=>e.onclick=ev=>{ev.stopPropagation();push(['f',+e.dataset.f])});
 document.querySelectorAll('[data-c]').forEach(e=>e.onclick=()=>push(['e',+e.dataset.c]));
 const top=stack[stack.length-1];document.querySelectorAll('[data-b]').forEach(e=>e.onclick=()=>push(['m',top[1],+e.dataset.b]));
 document.querySelectorAll('[data-d]').forEach(e=>e.onclick=()=>{const i=+e.dataset.d;openDiv=openDiv==i?-1:i;render()});
 const qi=$('#q');if(qi){qi.oninput=()=>{q=qi.value;const p=qi.selectionStart;render();const n=$('#q');n.focus();n.setSelectionRange(p,p)}}
 document.querySelectorAll('input[data-side]').forEach(inp=>{const s=inp.dataset.side,dd=$('#dd'+s);inp.onfocus=()=>{inp.select()};inp.oninput=()=>{if(s=='a'){qa=inp.value;ca=null}else{qb=inp.value;cb=null}dd.innerHTML=flist(inp.value,'data-p'+s);dd.hidden=!inp.value.trim();
  dd.querySelectorAll('[data-p'+s+']').forEach(e=>e.onclick=()=>{if(s=='a')ca=+e.getAttribute('data-pa');else cb=+e.getAttribute('data-pb');render()})}})}
(()=>{const h=new URLSearchParams(location.hash.slice(1));if(h.get('tab'))tab=h.get('tab');if(h.get('div'))openDiv=+h.get('div');if(h.get('q'))q=h.get('q');if(h.get('ca'))ca=+h.get('ca');if(h.get('cb'))cb=+h.get('cb');if(h.get('v'))stack=[h.get('v').split(',').map((x,i)=>i?+x:x)]})();
render();
</script></body></html>
